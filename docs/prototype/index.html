<body>
  <div class="studio">
    <aside class="rail">
      <a class="brand" href="?screen=home"><span class="brand-mark">切</span><span>推活日记<small>CHEKI DIARY</small></span></a>
      <div class="edition">PRODUCT PROTOTYPE · 01</div>
      <h1>把见面的瞬间，<br>好好留下。</h1>
      <p class="rail-intro">沿着日期，记住每次见面。<br>活动选填，照片可以慢慢补。</p>
      <nav id="scene-nav" aria-label="原型页面"></nav>

        <div id="app"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="modal"></div>
        <div class="home-indicator"></div>
      </section>
      <div class="stage-footer">交互原型 v0.4 <span>2026.10.11</span></div>
